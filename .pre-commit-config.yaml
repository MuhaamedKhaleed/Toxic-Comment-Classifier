repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: python -m ruff check src tests scripts
        language: system
        pass_filenames: false
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: python -m ruff format --check src tests scripts
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy
        name: mypy package
        entry: python -m mypy src
        language: system
        pass_filenames: false
        types: [python]
