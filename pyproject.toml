[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toxic-comments"
version = "0.1.0"
description = "Local data validation and explicit binary toxic comment classification"
requires-python = ">=3.11"
dependencies = ["typer==0.15.2", "click==8.1.8", "python-dotenv==1.1.0"]

[project.optional-dependencies]
ml = ["torch==2.4.1", "transformers==4.49.0", "scikit-learn==1.6.1", "accelerate==1.4.0"]
dev = ["pytest==8.3.5", "pytest-cov==6.0.0", "ruff==0.11.2", "mypy==1.15.0", "pre-commit==4.2.0"]

[project.scripts]
toxic-comments = "toxic_comments.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
